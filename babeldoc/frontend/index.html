<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BabelDOC - Intelligent PDF Translation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f8f9ff;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #f0f0ff;
        }

        .upload-icon {
            font-size: 3em;
            color: #667eea;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #333;
            font-size: 1.2em;
            margin-bottom: 5px;
        }

        .upload-subtext {
            color: #999;
            font-size: 0.9em;
        }

        input[type="file"] {
            display: none;
        }

        .file-info {
            background: #f8f9ff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }

        .file-info.active {
            display: block;
        }

        .file-name {
            color: #333;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .file-size {
            color: #666;
            font-size: 0.9em;
        }

        .language-selection {
            margin-bottom: 20px;
        }

        .language-selection label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .language-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            color: #333;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
        }

        .translate-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .translate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .translate-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .progress-container {
            display: none;
            margin-top: 20px;
        }

        .progress-container.active {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .progress-text {
            text-align: center;
            color: #666;
            font-size: 0.9em;
        }

        .result-container {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #f0fdf4;
            border-radius: 10px;
            border: 2px solid #86efac;
        }

        .result-container.active {
            display: block;
        }

        .result-icon {
            font-size: 2em;
            text-align: center;
            margin-bottom: 10px;
        }

        .result-text {
            text-align: center;
            color: #333;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .download-btn {
            width: 100%;
            padding: 12px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .download-btn:hover {
            background: #059669;
        }

        .error-container {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #fef2f2;
            border-radius: 10px;
            border: 2px solid #fca5a5;
        }

        .error-container.active {
            display: block;
        }

        .error-text {
            color: #dc2626;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📄 BabelDOC</h1>
            <p>Intelligent PDF Translation with Layout Preservation</p>
        </div>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📤</div>
            <div class="upload-text">Drop your PDF here or click to browse</div>
            <div class="upload-subtext">Supports PDF files up to 50MB</div>
            <input type="file" id="fileInput" accept=".pdf">
        </div>

        <div class="file-info" id="fileInfo">
            <div class="file-name" id="fileName"></div>
            <div class="file-size" id="fileSize"></div>
        </div>

        <div class="language-selection">
            <label>Translation Languages:</label>
            <div class="language-grid">
                <div>
                    <label style="font-weight: normal; font-size: 0.9em; margin-bottom: 5px;">From:</label>
                    <select id="sourceLang">
                        <option value="en">English</option>
                        <option value="ar">Arabic</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="zh">Chinese</option>
                    </select>
                </div>
                <div>
                    <label style="font-weight: normal; font-size: 0.9em; margin-bottom: 5px;">To:</label>
                    <select id="targetLang">
                        <option value="ar">Arabic</option>
                        <option value="en">English</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="zh">Chinese</option>
                    </select>
                </div>
            </div>
        </div>

        <button class="translate-btn" id="translateBtn" disabled>
            Translate Document
        </button>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">Processing your document...</div>
        </div>

        <div class="result-container" id="resultContainer">
            <div class="result-icon">✅</div>
            <div class="result-text">Translation completed successfully!</div>
            <button class="download-btn" id="downloadBtn">Download Translated PDF</button>
        </div>

        <div class="error-container" id="errorContainer">
            <div class="error-text" id="errorText"></div>
        </div>
    </div>

    <script>
        // API Configuration - UPDATE THIS WITH YOUR BACKEND URL
        const API_BASE_URL = 'http://localhost:8000';  // Change this to your deployed backend URL

        let selectedFile = null;
        let translatedFileBlob = null;

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const translateBtn = document.getElementById('translateBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const resultContainer = document.getElementById('resultContainer');
        const errorContainer = document.getElementById('errorContainer');
        const errorText = document.getElementById('errorText');
        const downloadBtn = document.getElementById('downloadBtn');

        // Upload area click
        uploadArea.addEventListener('click', () => fileInput.click());

        // File input change
        fileInput.addEventListener('change', handleFileSelect);

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        function handleFileSelect(e) {
            const files = e.target.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        }

        function handleFile(file) {
            if (file.type !== 'application/pdf') {
                showError('Please select a PDF file');
                return;
            }

            if (file.size > 50 * 1024 * 1024) {
                showError('File size must be less than 50MB');
                return;
            }

            selectedFile = file;
            fileName.textContent = file.name;
            fileSize.textContent = formatFileSize(file.size);
            fileInfo.classList.add('active');
            translateBtn.disabled = false;
            hideError();
            hideResult();
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        // Translate button click
        translateBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            const sourceLang = document.getElementById('sourceLang').value;
            const targetLang = document.getElementById('targetLang').value;

            if (sourceLang === targetLang) {
                showError('Source and target languages must be different');
                return;
            }

            await translateDocument(selectedFile, sourceLang, targetLang);
        });

        async function translateDocument(file, sourceLang, targetLang) {
            hideError();
            hideResult();
            showProgress('Uploading document...');
            translateBtn.disabled = true;

            try {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('source_lang', sourceLang);
                formData.append('target_lang', targetLang);

                const response = await fetch(`${API_BASE_URL}/translate`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || 'Translation failed');
                }

                updateProgress('Translation complete! Preparing download...');
                
                translatedFileBlob = await response.blob();
                showResult();
                hideProgress();

            } catch (error) {
                console.error('Translation error:', error);
                showError(error.message || 'An error occurred during translation');
                hideProgress();
            } finally {
                translateBtn.disabled = false;
            }
        }

        downloadBtn.addEventListener('click', () => {
            if (!translatedFileBlob) return;

            const url = window.URL.createObjectURL(translatedFileBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `translated_${selectedFile.name}`;
            document.body.appendChild(a);
            a.click();
            window.URL.revokeObjectURL(url);
            document.body.removeChild(a);
        });

        function showProgress(text) {
            progressText.textContent = text;
            progressContainer.classList.add('active');
            progressFill.style.width = '100%';
        }

        function updateProgress(text) {
            progressText.textContent = text;
        }

        function hideProgress() {
            progressContainer.classList.remove('active');
            progressFill.style.width = '0%';
        }

        function showResult() {
            resultContainer.classList.add('active');
        }

        function hideResult() {
            resultContainer.classList.remove('active');
        }

        function showError(message) {
            errorText.textContent = message;
            errorContainer.classList.add('active');
        }

        function hideError() {
            errorContainer.classList.remove('active');
        }
    </script>
</body>
</html>
